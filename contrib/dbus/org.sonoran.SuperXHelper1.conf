<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.sonoran.SuperXHelper1"/>
  </policy>
  <policy context="default">
    <deny own="org.sonoran.SuperXHelper1"/>
    <deny send_destination="org.sonoran.SuperXHelper1"/>
    <allow send_destination="org.sonoran.SuperXHelper1"
           send_path="/org/sonoran/SuperXHelper1"
           send_interface="org.sonoran.SuperXHelper1" send_member="GetSnapshot"/>
    <allow send_destination="org.sonoran.SuperXHelper1"
           send_path="/org/sonoran/SuperXHelper1"
           send_interface="org.sonoran.SuperXHelper1" send_member="SetCapability"/>
  </policy>
</busconfig>
