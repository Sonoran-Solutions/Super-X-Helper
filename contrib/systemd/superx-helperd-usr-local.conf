# Drop-in for superx-helperd.service when the package is installed with pip into
# /usr/local (the unit itself assumes a distro package at /usr/bin/superx-helperd).
# Install as /etc/systemd/system/superx-helperd.service.d/exec.conf.
# The empty ExecStart= clears the unit's value before setting the new one.
[Service]
ExecStart=
ExecStart=/usr/local/bin/superx-helperd
